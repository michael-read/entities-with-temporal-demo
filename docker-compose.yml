networks:
  temporal-network:
    driver: bridge
    name: temporal-network
    external: true

services:

  pulsar:
    image: apachepulsar/pulsar:latest
    container_name: pulsar
    command: /pulsar/bin/pulsar standalone
    volumes:
      - ./pulsar/init-pulsar.sh:/pulsar/init/init-pulsar.sh:ro  # Mount the script
    ports:
      - "6650:6650"
      - "8081:8080"
    healthcheck:
      test: curl --fail http://localhost:8080/admin/v2/clusters || exit 1
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    post_start:
      - command: /pulsar/init/init-pulsar.sh
    environment:
      PULSAR_MEM: "-Xms256m -Xmx512m"
    networks:
      - temporal-network

  producer:
    image: temporal-entity-demo/producer:latest
    deploy:
      replicas: 0
    environment:
      PULSAR_HOST: pulsar
    networks:
      - temporal-network
    depends_on:
      pulsar:
        condition: service_healthy

  consumer:
    image: temporal-entity-demo/consumer:latest
    deploy:
      replicas: 0
    environment:
      PULSAR_HOST: pulsar
      TEMPORAL_SERVER_TARGET_IP: temporal:7233
    networks:
      - temporal-network

  entity:
    image: temporal-entity-demo/user-entity:latest
    deploy:
      replicas: 5
    networks:
      - temporal-network

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./observability/entrypoint.sh:/bin/prometheus-entrypoint.sh
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml
    user: root
    entrypoint:
      - /bin/sh
      - /bin/prometheus-entrypoint.sh
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.console.libraries=/usr/share/prometheus/console_libraries
      - --web.console.templates=/usr/share/prometheus/consoles
    ports:
      - "9090:9090"
    networks:
      - temporal-network

  grafana:
    image: grafana/grafana:latest
    volumes:
      - ./observability/dashboards/:/var/lib/grafana/dashboards
      - ./observability/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml
      - ./observability/datasource/automatic.yml:/etc/grafana/provisioning/datasources/automatic.yml
    ports:
      - "3000:3000"
    networks:
      - temporal-network
    depends_on:
      - "prometheus"
