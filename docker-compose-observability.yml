networks:
  temporal-network:
    driver: bridge
    name: temporal-network

services:

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./observability/entrypoint.sh:/bin/prometheus-entrypoint.sh
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml
    user: root
    entrypoint:
      - /bin/sh
      - /bin/prometheus-entrypoint.sh
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.console.libraries=/usr/share/prometheus/console_libraries
      - --web.console.templates=/usr/share/prometheus/consoles
    ports:
      - "9090:9090"
    networks:
      - temporal-network
  
  grafana:
    image: grafana/grafana:latest
    volumes:
      - ./observability/dashboards/:/var/lib/grafana/dashboards
      - ./observability/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml
      - ./observability/datasource/automatic.yml:/etc/grafana/provisioning/datasources/automatic.yml
    ports:
      - "3000:3000"
    networks:
      - temporal-network
    depends_on:
      - "prometheus"
